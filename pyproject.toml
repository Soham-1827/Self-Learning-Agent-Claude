[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-learning-agent"
version = "0.2.2"
description = "Turn creator videos into vault notes and human-approved setup actions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "tomli>=2.0.1; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Turns each failure into a GitHub annotation, which is readable from the
    # public API. Job logs need admin rights, so without this a failure on a
    # platform the maintainer cannot run is visible only by hand.
    "pytest-github-actions-annotate-failures>=0.4.2",
]

[project.scripts]
sla = "self_learning_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live network; deselected by default"]
addopts = "-m 'not network'"
